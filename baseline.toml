# The single definition of the accepted baseline this manual documents.
#
# scripts/check_baseline.py requires every high-authority "current baseline" location (site footer, README and home
# tables, release and source-map tables, generated-project examples) to agree with [current]. scripts/check_content.py
# allows a full SHA in the manual only if it is listed here (current or history) or is an allowed action pin.
# Historical pages may name any release in [[history]]; old versions are not banned globally.
#
# To move the baseline: verify the new tags on GitHub, move the old [current] entry into [[history]], update [current],
# then run the checks; they list every location that still names the previous release.

